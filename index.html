<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYF Digital Management System</title>
    <style>
      :root {
        --navy: #231b68;
        --yellow: #fdf405;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f5f5;
      }
      header {
        background: var(--navy);
        color: white;
        padding: 24px;
        text-align: center;
        border-bottom: 6px solid var(--yellow);
      }
      header img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: white;
      }
      header h1 {
        margin: 12px 0 4px;
      }
      header p {
        margin: 0;
        color: var(--yellow);
        font-weight: bold;
      }
      main {
        max-width: 480px;
        margin: 24px auto;
        background: white;
        padding: 24px;
        border-radius: 8px;
      }
      h2 {
        color: var(--navy);
        border-bottom: 3px solid var(--yellow);
        padding-bottom: 4px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
      }
      .stats {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .stat {
        flex: 1;
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        text-align: center;
      }
      .stat strong {
        display: block;
        font-size: 24px;
        color: var(--navy);
      }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        background: var(--navy);
        color: var(--yellow);
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .announcement {
        background: #fffde0;
        border-left: 6px solid var(--yellow);
        padding: 12px;
        margin-top: 12px;
        border-radius: 4px;
      }
      .announcement h4 {
        margin: 0 0 4px;
        color: var(--navy);
      }
      .announcement p {
        margin: 0 0 8px;
        white-space: pre-wrap;
      }
      .announcement small {
        color: #666;
      }
      .announcement img,
      .announcement video {
        display: block;
        max-width: 100%;
        border-radius: 6px;
        margin: 8px 0;
      }
      .announcement button {
        margin-top: 8px;
        padding: 4px 10px;
        font-size: 12px;
        display: block;
      }
      .note {
        color: #a00;
        font-size: 13px;
      }
      #mediaStatus {
        font-size: 13px;
        color: #555;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="logo.jpg" alt="MYF Ghana logo" />
      <h1>Methodist Youth Fellowship</h1>
      <p>We Work. We Witness. We Worship.</p>
    </header>
    <main>
      <h2>Announcements</h2>
      <div id="announcementList"></div>

      <h3>Post an Announcement</h3>
      <label>Title</label>
      <input
        type="text"
        id="annTitle"
        placeholder="e.g. Fellowship this Friday"
      />
      <label>Message</label>
      <textarea
        id="annMessage"
        rows="3"
        placeholder="Write the announcement here"
      ></textarea>
      <label>Picture or Video (optional)</label>
      <input type="file" id="annMedia" accept="image/*,video/*" />
      <div id="mediaStatus"></div>
      <button type="button" id="postAnnouncement">Post Announcement</button>

      <h2>Member Registration</h2>
      <form id="regForm">
        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        />
        <label>Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          required
        />
        <label>Level / Occupation</label>
        <input type="text" id="level" placeholder="e.g. Level 300 or Teacher" />
        <label>Role</label>
        <select id="role">
          <option>Member</option>
          <option>Executive</option>
        </select>
        <button type="submit">Register</button>
      </form>

      <h2>Registered Members (<span id="count">0</span>)</h2>
      <ul id="memberList"></ul>

      <h2>Take Attendance</h2>
      <label>Event / Meeting</label>
      <input type="text" id="eventName" placeholder="e.g. Friday Fellowship" />
      <label>Date</label>
      <input type="date" id="eventDate" />
      <div id="attendanceList"></div>
      <button type="button" id="saveAttendance">Save Attendance</button>

      <h2>Past Attendance</h2>
      <ul id="attendanceHistory"></ul>

      <h2>Dashboard</h2>
      <div class="stats">
        <div class="stat"><strong id="totalMembers">0</strong>Members</div>
        <div class="stat"><strong id="totalMeetings">0</strong>Meetings</div>
        <div class="stat">
          <strong id="avgAttendance">0</strong>Avg. present
        </div>
      </div>
      <h3>Attendance by Member</h3>
      <ul id="memberStats"></ul>
    </main>

    <script>
      const form = document.getElementById("regForm");
      const list = document.getElementById("memberList");
      const count = document.getElementById("count");
      const attendanceList = document.getElementById("attendanceList");
      const history = document.getElementById("attendanceHistory");
      const announcementList = document.getElementById("announcementList");
      const mediaStatus = document.getElementById("mediaStatus");

      let members = JSON.parse(localStorage.getItem("myfMembers")) || [];
      let records = JSON.parse(localStorage.getItem("myfAttendance")) || [];
      let announcements =
        JSON.parse(localStorage.getItem("myfAnnouncements")) || [];

      // ---------- Video storage (IndexedDB) ----------
      function openDB() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB)
            return reject(new Error("This browser cannot store videos."));
          const req = indexedDB.open("myfMedia", 1);
          req.onupgradeneeded = () => req.result.createObjectStore("media");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () =>
            reject(new Error("This browser cannot store videos."));
        });
      }
      async function saveMedia(id, file) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction("media", "readwrite");
          tx.objectStore("media").put(file, id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(new Error("Could not save the video."));
        });
      }
      async function getMedia(id) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const req = db.transaction("media").objectStore("media").get(id);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(new Error("Could not load the video."));
        });
      }
      async function deleteMedia(id) {
        try {
          const db = await openDB();
          db.transaction("media", "readwrite").objectStore("media").delete(id);
        } catch (err) {}
      }

      // ---------- Picture shrinking ----------
      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, 900 / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas
              .getContext("2d")
              .drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
          img.onerror = () =>
            reject(
              new Error(
                "This picture format is not supported. Please use a JPG or PNG.",
              ),
            );
          img.src = url;
        });
      }

      // ---------- Announcements ----------
      async function showAnnouncements() {
        announcementList.innerHTML = "";
        if (announcements.length === 0) {
          announcementList.textContent = "No announcements yet.";
          return;
        }
        const items = announcements
          .map((a, i) => ({ ...a, index: i }))
          .reverse();

        for (const a of items) {
          const box = document.createElement("div");
          box.className = "announcement";

          const title = document.createElement("h4");
          title.textContent = a.title;
          box.appendChild(title);

          if (a.message) {
            const msg = document.createElement("p");
            msg.textContent = a.message;
            box.appendChild(msg);
          }

          if (a.image) {
            const img = document.createElement("img");
            img.src = a.image;
            img.alt = a.title;
            box.appendChild(img);
          } else if (a.mediaId) {
            try {
              const file = await getMedia(a.mediaId);
              if (!file) throw new Error("missing");
              const url = URL.createObjectURL(file);
              let el;
              if (a.mediaType === "video") {
                el = document.createElement("video");
                el.controls = true;
              } else {
                el = document.createElement("img");
                el.alt = a.title;
              }
              el.src = url;
              box.appendChild(el);
            } catch (err) {
              const note = document.createElement("p");
              note.className = "note";
              note.textContent =
                "(The picture or video for this post could not be loaded.)";
              box.appendChild(note);
            }
          }

          const date = document.createElement("small");
          date.textContent = "Posted " + a.date;
          box.appendChild(date);

          const del = document.createElement("button");
          del.textContent = "Delete";
          del.addEventListener("click", async () => {
            if (a.mediaId) await deleteMedia(a.mediaId);
            announcements.splice(a.index, 1);
            localStorage.setItem(
              "myfAnnouncements",
              JSON.stringify(announcements),
            );
            showAnnouncements();
          });
          box.appendChild(del);

          announcementList.appendChild(box);
        }
      }

      document.getElementById("annMedia").addEventListener("change", (e) => {
        const file = e.target.files[0];
        mediaStatus.textContent = file
          ? "Selected: " +
            file.name +
            " (" +
            (file.size / 1048576).toFixed(1) +
            " MB)"
          : "";
      });

      document
        .getElementById("postAnnouncement")
        .addEventListener("click", async () => {
          const title = document.getElementById("annTitle").value.trim();
          const message = document.getElementById("annMessage").value.trim();
          const file = document.getElementById("annMedia").files[0];

          if (!title || (!message && !file)) {
            alert("Please enter a title and a message or a picture/video.");
            return;
          }
          if (file && file.size > 50 * 1048576) {
            alert(
              "That file is bigger than 50 MB. Please choose a smaller one.",
            );
            return;
          }

          const post = {
            title,
            message,
            date: new Date().toLocaleDateString(),
          };

          try {
            if (file) {
              if (file.type.startsWith("video")) {
                const mediaId = "media-" + Date.now();
                await saveMedia(mediaId, file);
                post.mediaId = mediaId;
                post.mediaType = "video";
              } else {
                post.image = await compressImage(file);
              }
            }
            const updated = [...announcements, post];
            localStorage.setItem("myfAnnouncements", JSON.stringify(updated));
            announcements = updated;
          } catch (err) {
            alert("Could not post: " + err.message);
            return;
          }

          showAnnouncements();
          document.getElementById("annTitle").value = "";
          document.getElementById("annMessage").value = "";
          document.getElementById("annMedia").value = "";
          mediaStatus.textContent = "";
        });

      // ---------- Dashboard, members, attendance ----------
      function showDashboard() {
        document.getElementById("totalMembers").textContent = members.length;
        document.getElementById("totalMeetings").textContent = records.length;

        const total = records.reduce((sum, r) => sum + r.present.length, 0);
        const avg = records.length ? (total / records.length).toFixed(1) : 0;
        document.getElementById("avgAttendance").textContent = avg;

        const stats = document.getElementById("memberStats");
        stats.innerHTML = "";
        members
          .map((m) => ({
            name: m.name,
            attended: records.filter((r) => r.present.includes(m.name)).length,
          }))
          .sort((a, b) => b.attended - a.attended)
          .forEach((s) => {
            const li = document.createElement("li");
            li.textContent =
              s.name +
              ": " +
              s.attended +
              " of " +
              records.length +
              " meetings";
            stats.appendChild(li);
          });
      }

      function showMembers() {
        list.innerHTML = "";
        attendanceList.innerHTML = "";
        members.forEach((m, i) => {
          const li = document.createElement("li");
          li.textContent =
            m.name + " | " + m.phone + " | " + m.level + " | " + m.role;
          list.appendChild(li);

          const row = document.createElement("div");
          row.innerHTML =
            '<label><input type="checkbox" value="' +
            i +
            '" /> ' +
            m.name +
            "</label>";
          attendanceList.appendChild(row);
        });
        count.textContent = members.length;
      }

      function showHistory() {
        history.innerHTML = "";
        records.forEach((r) => {
          const li = document.createElement("li");
          li.textContent =
            r.date + " | " + r.event + " | " + r.present.length + " present";
          history.appendChild(li);
        });
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        members.push({
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          level: document.getElementById("level").value,
          role: document.getElementById("role").value,
        });
        localStorage.setItem("myfMembers", JSON.stringify(members));
        showMembers();
        showDashboard();
        form.reset();
      });

      document
        .getElementById("saveAttendance")
        .addEventListener("click", () => {
          const event = document.getElementById("eventName").value;
          const date = document.getElementById("eventDate").value;
          if (!event || !date) {
            alert("Please enter the event name and date.");
            return;
          }
          const boxes = attendanceList.querySelectorAll("input:checked");
          const present = Array.from(boxes).map((b) => members[b.value].name);
          records.push({ event, date, present });
          localStorage.setItem("myfAttendance", JSON.stringify(records));
          showHistory();
          showDashboard();
          boxes.forEach((b) => (b.checked = false));
          document.getElementById("eventName").value = "";
          document.getElementById("eventDate").value = "";
        });

      showAnnouncements();
      showMembers();
      showHistory();
      showDashboard();
    </script>
  </body>
</html>
